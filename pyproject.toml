[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "genai-lab"
version = "0.1.0"
description = "Experimenting with Generative AI Ideas"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name="babaksoft", email="babak.eslamieh@gmail.com" },
]
keywords = ["machine learning"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
license-files = ["LICEN[CS]E*"]

dependencies = [
    "alembic",
    "arize-phoenix",
    "click",
    "fastapi[standard]",
    "langfuse",
    "llama-agents",
    "llama-index",
    "llama-index-callbacks-arize-phoenix",
    "llama-index-embeddings-openai",
    "llama-index-llms-ollama",
    "llama-index-llms-openai",
    "llama-index-utils-workflow",
    "llama-index-vector-stores-postgres",
    "ollama",
    "openai",
    "openinference-instrumentation-llama-index",
    "pgvector",
    "psycopg2",
    "python-dotenv",
    "requests",
    "SQLAlchemy",
    "streamlit",
    "tiktoken",
]

[project.urls]
Homepage = "https://github.com/babaksoft/genai-lab"
Issues = "https://github.com/babaksoft/genai-lab/issues"

[project.optional-dependencies]
build = [
    "build",
    "hatchling",
]

dev = [
    "black",
    "isort",
    "mypy",
    "pytest",
    "ruff",
]

[tool.black]
target-version = ["py312"]

[tool.isort]
profile = "black"
known_third_party = [
    "alembic",
    "sqlalchemy",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build]
sources = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/genai_lab"]
